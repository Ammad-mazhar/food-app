# Netlify build configuration.
#
# The Next.js runtime plugin handles routing, server components and the API
# routes — there is no `publish` directory to set by hand for an app that is
# mostly server-rendered.

[build]
  command = "npm run build"

# Prisma's generated client is gitignored (it is build output, not source), so
# it must be regenerated on the build machine. `postinstall` in package.json
# already runs `prisma generate`; this makes the dependency explicit for anyone
# reading the config.
#
# SECRETS_SCAN_OMIT_PATHS covers Turbopack's persistent cache. Turbopack records
# the env vars a build read so it can invalidate compiled output when one
# changes, which writes SESSION_SECRET into .netlify/.next/cache/turbopack/*.sst
# and fails the secrets scan on every build. That directory is build-time only —
# it is never uploaded to the CDN, bundled into a function, or served.
#
# Scoped to that one path on purpose. SECRETS_SCAN_OMIT_KEYS or
# SECRETS_SCAN_ENABLED=false would also silence the scan over real deployed
# output, and the scan has already caught one genuinely broken secret here.
  environment = { NODE_VERSION = "22", SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**" }

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# The service worker must never be served from cache. A browser only picks up a
# new worker when it fetches a byte-different sw.js, so a CDN-cached copy would
# pin every returning visitor to the old one — including anyone currently stuck
# on the v1 worker that cached HTML and choked on 206 video responses.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[context.deploy-preview]
  [context.deploy-preview.environment]
    NEXT_PUBLIC_SITE_URL = ""

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex"
