# Netlify build configuration.
#
# The Next.js runtime plugin handles routing, server components and the API
# routes — there is no `publish` directory to set by hand for an app that is
# mostly server-rendered.

[build]
  command = "npm run build"

# Prisma's generated client is gitignored (it is build output, not source), so
# it must be regenerated on the build machine. `postinstall` in package.json
# already runs `prisma generate`; this makes the dependency explicit for anyone
# reading the config.
  environment = { NODE_VERSION = "22" }

# ---------------------------------------------------------------------------
# SECRETS_SCAN_OMIT_PATHS IS SET IN THE NETLIFY UI, NOT HERE. DO NOT ADD IT BACK
# TO THIS FILE.
#
# It must be set, or the build fails: Turbopack records the env vars a build
# read so it can invalidate compiled output when one changes, which writes
# SESSION_SECRET verbatim into .netlify/.next/cache/turbopack/*.sst. The secrets
# scanner walks that directory and stops the build. (That cache is build-time
# only — never uploaded to the CDN, bundled into a function, or served. The
# value is on the same build machine that already holds the env var.)
#
# The value to set in the UI is the path `.netlify/.next/cache/` followed by a
# recursive glob (two asterisks). Written in pieces on purpose — see below.
#
# Why not here, and why the value is spelled out in pieces above: the scanner
# does a plain substring search of the repo for the values of ALL build
# environment variables, including ones declared in this file, and it does not
# skip comments. Writing that value anywhere in this file — as a setting OR as
# documentation — makes it find itself and fail every build with
#
#   Secret env var "SECRETS_SCAN_OMIT_PATHS"'s value detected:
#     found value at line 24 in netlify.toml
#
# Keep the scope narrow when setting it. SECRETS_SCAN_OMIT_KEYS or
# SECRETS_SCAN_ENABLED=false would silence the scan over real deployed output
# too, and this scan has already caught one genuinely broken secret here.
# ---------------------------------------------------------------------------

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# The service worker must never be served from cache. A browser only picks up a
# new worker when it fetches a byte-different sw.js, so a CDN-cached copy would
# pin every returning visitor to the old one — including anyone currently stuck
# on the v1 worker that cached HTML and choked on 206 video responses.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[context.deploy-preview]
  [context.deploy-preview.environment]
    NEXT_PUBLIC_SITE_URL = ""

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex"
